<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Odyssey</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
        }
        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (min-width: 1024px) {
            body {
                height: 100dvh;
                overflow: hidden;
            }
            img {
                width: 100vw;
                height: 100dvh;
                object-fit: fill;
            }
        }
    </style>
</head>
<body>
    <img src="sonic_odyssey.jpg" alt="Sonic_Odyssey">
</body>
</html>
